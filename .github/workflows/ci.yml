name: ci

# Runs on every PR and on every push to main. Pure quality gate — does NOT
# deploy. Railway auto-deploys main from its own GitHub integration; Vercel
# does the same for apps/dashboard. CI's job is to fail the merge button
# before bad code reaches either deploy target.

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same PR/branch when a new commit lands —
# saves CI minutes and gives faster feedback.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + tests + dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22.6+ — the .mts test files in apps/browser-ext, apps/vscode-ext,
          # and packages/score-card use `--experimental-strip-types`, which was
          # introduced in 22.6.0. (Node 23.6.0 makes stripping default.)
          node-version: '22'
          cache: npm

      # `npm ci` is faster + stricter than `npm install` and respects
      # package-lock.json exactly. Required for reproducible CI.
      - name: install
        run: npm ci

      # Fans out to every workspace's `typecheck` script. Skips workspaces
      # that don't define one (--if-present is set in the root scripts).
      - name: typecheck
        run: npm run typecheck

      # Runs every workspace's `test` script. None of these tests hit the
      # live API — they're unit + bundle-load + CLI smoke tests. Total
      # runtime is ~10s, so we don't bother splitting the matrix.
      - name: test
        run: npm test

      # Production-build the dashboard so PRs can't break the Vercel deploy
      # without showing red here first. Builds the same way Vercel does.
      - name: build dashboard
        run: npm --workspace=apps/dashboard run build

  lint:
    name: eslint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: install
        run: npm ci
      # Flat config at the repo root (eslint.config.mjs): typescript-eslint
      # everywhere, eslint-config-next for apps/dashboard.
      - name: lint
        run: npm run lint

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Reads package-lock.json against the advisory DB; no install needed.
      # Fails on any high/critical advisory in the full tree (dev included:
      # the extensions ship what their build tools produce).
      - name: audit
        run: npm audit --audit-level=high

  docker:
    name: docker image + compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The self-hosting quick start is `docker compose up`; make sure the
      # compose file still parses and the API image still builds from it.
      - name: compose config
        run: GEMINI_API_KEY=ci-placeholder docker compose config --quiet
      - name: build api image
        run: docker build -f apps/api/Dockerfile -t trailhead-api:ci .
      # Run the quick start the way a stranger would, with no key (offline
      # mode), and check the stack actually works: schema applied, API up,
      # registration, a wiki write, a rule-based score, and the demo seed.
      - name: compose smoke test (offline mode, demo seed)
        env:
          TRAILHEAD_LLM: offline
        run: |
          set -euo pipefail
          docker compose -p ci up -d --build --wait --wait-timeout 180
          docker compose -p ci --profile demo run --rm seed
          api=http://127.0.0.1:3000
          curl -fsS $api/ | jq -e '.status == "ok" and .llm == "offline"'
          secret=$(curl -fsS -X POST $api/teams -H 'content-type: application/json' \
            -d '{"team_id":"team_ci_smoke","name":"ci"}' | jq -er .secret)
          curl -fsS -X POST $api/wiki/propose -H "X-Team-Token: $secret" -H 'content-type: application/json' \
            -d '{"node_path":"src/","insight":"Errors return JSON {error, detail}.","user_id":"ci"}' | jq -e '.action == "created"'
          curl -fsS -X POST $api/score -H "X-Team-Token: $secret" -H 'content-type: application/json' \
            -d '{"prompt":"fix it","user_id":"ci"}' | jq -e '.scorer == "heuristic" and .overall <= 2'
          curl -fsS $api/team/metrics -H 'X-Team-Token: trailhead_demo_acme_2026' | jq -e '.total_obs >= 700 and .active_users == 3'
      - name: compose logs
        if: failure()
        run: docker compose -p ci --profile demo logs
      - name: compose down
        if: always()
        run: docker compose -p ci --profile demo down -v

  integration:
    name: api integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trailhead
          POSTGRES_PASSWORD: trailhead
          # The suite wipes its database and refuses names not ending in _it/_test.
          POSTGRES_DB: trailhead_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trailhead -d trailhead_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: install
        run: npm ci
      # Every route, two tenants, real Postgres; Gemini is stubbed in-process,
      # so no API key or network is involved.
      - name: integration tests
        env:
          TRAILHEAD_IT_DATABASE_URL: postgresql://trailhead:trailhead@localhost:5432/trailhead_it
        run: npm --workspace=apps/api run test:integration
