name: release

# Push a tag vX.Y.Z (from main) and this attaches both extension packages to
# the GitHub release for that tag, creating it as a draft if it doesn't exist
# yet. Publishing the release, and any store listing, stays a human step.
#
# The tag must match the version in apps/browser-ext/manifest.json and
# apps/vscode-ext/package.json, or the build fails before packaging anything.
# Assets are only ever (re)placed on a draft: once a release is published, a
# re-run fails instead of swapping the files people may already have.

on:
  push:
    tags: ['v*']

# Nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  build:
    name: test and package the extensions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: versions match the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          for f in apps/browser-ext/manifest.json apps/browser-ext/package.json apps/vscode-ext/package.json; do
            have=$(jq -r .version "$f")
            if [ "$have" != "$want" ]; then
              echo "::error file=$f::version is $have but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: install
        run: npm ci
      - name: test
        run: npm test
      - name: package
        run: |
          npm --workspace=@trailhead/browser-ext run package
          npm --workspace=apps/vscode-ext run package
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            apps/browser-ext/learnloop-browser-ext-*.zip
            apps/vscode-ext/*.vsix
          if-no-files-found: error

  release:
    name: attach to the draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job that can write to the repository, and it runs no repo code.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: packages
      - name: attach
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::release $tag is already published; not replacing its assets. Delete the assets or tag a new version."
              exit 1
            fi
          else
            gh release create "$tag" --draft --verify-tag --generate-notes --title "LearnLoop $tag"
          fi
          # Still a draft here, so replacing a file from an earlier run is safe.
          find packages -type f \( -name '*.zip' -o -name '*.vsix' \) -print0 \
            | xargs -0 gh release upload "$tag" --clobber
