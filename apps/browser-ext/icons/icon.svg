<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- LearnLoop mark (the two interlocking rings from the landing page) on the
       brand's ink background. Master for icon-16/32/48/128.png (Chrome wants
       PNG icons): rendered at 512 px in headless Chromium, then downscaled
       with Lanczos. apps/vscode-ext/media/icon.png is the 128 px one. -->
  <defs>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1FA29A" />
      <stop offset="0.55" stop-color="#2BC68A" />
      <stop offset="1" stop-color="#5BE0A8" />
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#0E1A1F" />
  <circle cx="47" cy="64" r="23" fill="none" stroke="url(#loop)" stroke-width="11" />
  <circle cx="81" cy="64" r="23" fill="none" stroke="url(#loop)" stroke-width="11" />
</svg>
