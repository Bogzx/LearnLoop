# Trailhead — self-hosted stack: Postgres + the API.
#
#   cp .env.example .env     # then put your Gemini key in it
#   docker compose up
#
# No key? `TRAILHEAD_LLM=offline docker compose up` runs the same stack with
# no model: rule-based scoring and template coaching (SELFHOSTING.md). Add
# `--profile demo` to load synthetic demo data for the dashboard.
#
# The schema is applied to a fresh database automatically, and the API comes
# up on http://localhost:3000. See SELFHOSTING.md for pointing the clients at it.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trailhead}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trailhead}
      POSTGRES_DB: ${POSTGRES_DB:-trailhead}
    volumes:
      # Named volume: data survives `docker compose down`. Use
      # `docker compose down -v` to wipe it (see SELFHOSTING.md).
      - trailhead-pgdata:/var/lib/postgresql/data
      # Anything in this directory runs, in filename order, the FIRST time the
      # data directory is initialised — i.e. on a fresh volume only. That is
      # how the schema gets applied without a manual psql step. schema.sql is
      # idempotent (every CREATE uses IF NOT EXISTS) so re-running is safe.
      - ./packages/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      # The API waits on this, so it must mean "ready for queries", not just
      # "process started". -U/-d avoid a false pass from the bootstrap phase.
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-trailhead} -d ${POSTGRES_DB:-trailhead}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      # Exposed for psql / the seed + migrate scripts in packages/db. Change
      # POSTGRES_PORT if 5432 is already taken on your machine.
      #
      # Bound to 127.0.0.1 deliberately. A bare '5432:5432' publishes on every
      # interface, which on a laptop means the database is reachable by anyone
      # on the same café / office network.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    restart: unless-stopped

  api:
    build:
      # Root context: this is an npm workspace monorepo and the install needs
      # the root lockfile plus every workspace manifest.
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      # Defaults to the postgres service above. Set DATABASE_URL in .env to
      # point at an external database instead (Neon, RDS, ...).
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-trailhead}:${POSTGRES_PASSWORD:-trailhead}@postgres:5432/${POSTGRES_DB:-trailhead}}
      # Every LLM call uses it. Without it the API refuses to start (and logs
      # how to fix it) unless TRAILHEAD_LLM=offline.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # gemini (default) | offline: no model at all — prompts are scored by the
      # rule-based scorer, coaching uses the static templates, and the rich
      # wiki bootstrap is disabled. For trying the stack without a key.
      TRAILHEAD_LLM: ${TRAILHEAD_LLM:-}
      # Container-internal port. The host mapping below is what you change.
      PORT: '3000'
      # Team credentials (see SELFHOSTING.md → Security model). `init`
      # registers each repo's team via POST /teams and gets a server-minted
      # secret, so nothing here needs changing for a local setup.
      #
      # Pre-2026-09-30 tokens (repo_…, derived from the git remote URL) keep
      # working for teams that have not been upgraded. Deprecated: set false
      # once every team has run `init --upgrade-legacy`.
      TRAILHEAD_ACCEPT_LEGACY_TOKENS: ${TRAILHEAD_ACCEPT_LEGACY_TOKENS:-true}
      # With legacy tokens accepted, an unknown X-Team-Token spawns a legacy
      # team — unauthenticated tenant creation. It used to default true here
      # because the old `init` invented tokens offline; the new `init`
      # registers instead, so it is off. Only for throwaway demo deploys.
      TRAILHEAD_AUTO_CREATE_TEAMS: ${TRAILHEAD_AUTO_CREATE_TEAMS:-false}
      # Set to restrict POST /teams (team registration) to holders of this
      # value (sent as X-Admin-Token / `init --admin-token`). Empty = open
      # registration, which is fine while the port below is bound to
      # 127.0.0.1. Set it before exposing the API on a network.
      TRAILHEAD_ADMIN_TOKEN: ${TRAILHEAD_ADMIN_TOKEN:-}
      # The public demo team: on unless TRAILHEAD_ADMIN_TOKEN is set (on | off).
      TRAILHEAD_DEMO_TEAM: ${TRAILHEAD_DEMO_TEAM:-}
      TRAILHEAD_EXPOSE_ERRORS: ${TRAILHEAD_EXPOSE_ERRORS:-false}
      # Rate limits — defaults live in apps/api/src/rate-limit.ts; empty = default.
      TRAILHEAD_RATE_LIMIT: ${TRAILHEAD_RATE_LIMIT:-on}
      TRAILHEAD_RL_REGISTER_PER_IP: ${TRAILHEAD_RL_REGISTER_PER_IP:-}
      TRAILHEAD_RL_LLM_PER_TEAM: ${TRAILHEAD_RL_LLM_PER_TEAM:-}
      TRAILHEAD_RL_LLM_PER_IP: ${TRAILHEAD_RL_LLM_PER_IP:-}
      TRAILHEAD_RL_BOOTSTRAP_PER_TEAM: ${TRAILHEAD_RL_BOOTSTRAP_PER_TEAM:-}
      TRAILHEAD_TRUST_PROXY: ${TRAILHEAD_TRUST_PROXY:-false}
      # auto (default) | review — see .env.example / SELFHOSTING.md.
      TRAILHEAD_PROMOTION_MODE: ${TRAILHEAD_PROMOTION_MODE:-auto}
      # Guard on DELETE /team/data for the seeded demo team.
      TRAILHEAD_ALLOW_DEMO_RESET: ${TRAILHEAD_ALLOW_DEMO_RESET:-false}
      # Optional tracing. Unset = silently disabled with a startup warning.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASEURL: ${LANGFUSE_BASEURL:-https://cloud.langfuse.com}
    ports:
      # host:container — set PORT in .env to publish somewhere other than 3000.
      # Every client default (browser ext, VS Code ext, MCP server, dashboard)
      # is http://localhost:3000, so changing this means updating those too.
      #
      # Bound to 127.0.0.1. Before dropping that prefix to expose the API,
      # set TRAILHEAD_ADMIN_TOKEN (so strangers can't register teams and
      # spend your Gemini quota), keep TRAILHEAD_AUTO_CREATE_TEAMS=false, and
      # plan to turn TRAILHEAD_ACCEPT_LEGACY_TOKENS off.
      - '127.0.0.1:${PORT:-3000}:3000'
    depends_on:
      postgres:
        # Don't start until Postgres answers pg_isready — the API opens its
        # pool and runs a startup migration check immediately.
        condition: service_healthy
    healthcheck:
      # GET / is the API's status endpoint (no auth). wget ships with the
      # busybox userland in node:22-alpine.
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Optional synthetic demo data for the public demo team (wiki, library
  # prompts, six days of prompt activity): see packages/db/seed.mjs.
  #
  #   docker compose --profile demo up
  #
  # Runs once after the API is healthy, then exits. Idempotent; re-running
  # moves the activity window to the last six days again.
  seed:
    profiles: [demo]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'packages/db/seed.mjs']
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-trailhead}:${POSTGRES_PASSWORD:-trailhead}@postgres:5432/${POSTGRES_DB:-trailhead}}
    depends_on:
      api:
        condition: service_healthy
    restart: 'no'

volumes:
  trailhead-pgdata:
